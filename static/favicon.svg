<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      .road-major { stroke: #3d4451; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .road-minor { stroke: #3d4451; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.75; }
      .road-fine { stroke: #3d4451; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.5; }
      .node { fill: #82a1b9; }
      .node-ring { stroke: #82a1b9; stroke-width: 2; fill: none; opacity: 0.7; }
      @media (prefers-color-scheme: dark) {
        .road-major { stroke: #e2e6ec; }
        .road-minor { stroke: #cbd3de; }
        .road-fine { stroke: #9ba7b7; }
        .node { fill: #9cb4cd; }
        .node-ring { stroke: #9cb4cd; }
      }
    </style>
  </defs>
  <!-- Street Grid Network (Freeform Open Cartography) -->
  <path d="M 28 20 C 38 42, 54 58, 64 64 C 74 70, 94 92, 102 108" class="road-major"/>
  <path d="M 20 88 C 40 82, 54 74, 64 64 C 76 52, 92 36, 110 32" class="road-major"/>
  <path d="M 64 10 L 64 118" class="road-major"/>
  <path d="M 12 50 C 32 50, 50 48, 64 42 C 80 34, 100 24, 116 20" class="road-minor"/>
  <path d="M 14 74 C 36 76, 52 82, 64 88 C 82 96, 98 106, 112 112" class="road-minor"/>
  <path d="M 40 18 L 40 110" class="road-minor"/>
  <path d="M 88 18 L 88 110" class="road-minor"/>
  <path d="M 26 36 L 52 36" class="road-fine"/>
  <path d="M 76 36 L 102 36" class="road-fine"/>
  <path d="M 24 100 L 50 100" class="road-fine"/>
  <path d="M 78 92 L 104 92" class="road-fine"/>
  <path d="M 52 56 L 52 74" class="road-fine"/>
  <path d="M 76 54 L 76 72" class="road-fine"/>
  <!-- Central Crossroads Node in Chronicle Sole Accent -->
  <circle cx="64" cy="64" r="8" class="node-ring"/>
  <circle cx="64" cy="64" r="5" class="node"/>
  <circle cx="40" cy="84" r="3" class="node" opacity="0.9"/>
  <circle cx="88" cy="46" r="3" class="node" opacity="0.9"/>
</svg>
